name: rebuild-feed-once

# Einmaliges Reparatur-Skript.
# Nach erfolgreichem Lauf kann diese Datei wieder gelöscht werden.
# Manuell auszulösen über Actions -> "rebuild-feed-once" -> Run workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: write   # zum Committen der neuen feed.xml

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: mutagen installieren
        run: pip install mutagen

      - name: feed.xml aus allen MP3s neu bauen
        run: python rebuild_feed.py

      - name: Neue feed.xml committen
        run: |
          git config user.name "ki-news-bot"
          git config user.email "actions@github.com"
          git add docs/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Feed einmalig aus allen Episoden neu aufgebaut"
            git push
          else
            echo "Keine Änderung an feed.xml."
          fi
